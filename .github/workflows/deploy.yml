name: Verify and publish VELORA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: velora-pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run test:unit && npm run build
      - name: Full browser suite with preinstalled Chrome
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-browser-evidence
          path: |
            playwright-report/
            test-results/
            qa/screenshots/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
  live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify exact deployed commit and every asset hash
        run: node scripts/verify-release.mjs '${{ needs.deploy.outputs.page_url }}'
      - name: Repeat full browser suite on the public site
        run: npm run test:e2e
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-browser-evidence
          path: |
            playwright-report/
            test-results/
            qa/screenshots/
